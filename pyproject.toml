[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsebot"
version = "0.1.0"
description = "Rule-based NSE intraday options trading system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "kiteconnect>=5.0,<6",
    "boto3>=1.34,<2",
    "PyYAML>=6.0,<7",
    "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
nsebot = "nsebot.cli:main"
nsebot-engine = "nsebot.engine:main"
nsebot-api = "nsebot.api.app:main"
nsebot-migrate-sqlite = "nsebot.migrate:main"
nsebot-dynamodb-init = "nsebot.init_dynamodb:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nsebot/ui" = ["ui/index.html", "ui/app.js", "ui/styles.css"]
"share/nsebot/config" = ["config/default_rules.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
